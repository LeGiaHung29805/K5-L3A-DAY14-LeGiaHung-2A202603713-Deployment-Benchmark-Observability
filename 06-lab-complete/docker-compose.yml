services:
  agent:
    build: .
    expose:
      - "8000"
    deploy:
      replicas: 3
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8000"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 8s
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      agent:
        condition: service_healthy
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
    restart: unless-stopped
volumes:
  redis_data:
